    title: "Lab 1 (due 8/28)"
    label: lab
    num: 1
    link: https://data8.datahub.berkeley.edu/hub/user-redirect/git-pull?repo=https%3A%2F%2Fgithub.com%2Fdata-8%2Fmaterials-fa26&branch=main&urlpath=tree%2Fmaterials-fa26%2Flab%2Flab01%2Flab01.ipynb
  # - date: 2026-09-23
